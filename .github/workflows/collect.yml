name: Collect GSC Metrics

on:
  schedule:
    # Пн, Ср, Пт в 08:00 UTC
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:  # ручной запуск из интерфейса GitHub

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore GSC tokens
        run: |
          mkdir -p tokens
          python3 -c "
          import json, os, pickle, base64
          tokens_json = os.environ['GSC_TOKENS_JSON']
          tokens = json.loads(tokens_json)
          for email, b64 in tokens.items():
              path = f'tokens/{email}.pickle'
              with open(path, 'wb') as f:
                  f.write(base64.b64decode(b64))
              print(f'  Восстановлен токен: {path}')
          "
        env:
          GSC_TOKENS_JSON: ${{ secrets.GSC_TOKENS_JSON }}

      - name: Restore Sheets service account
        run: echo '${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}' > sheets_service_account.json

      - name: Run collector — smsactivate
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python collect.py smsactivate

      - name: Run collector — platov
        env:
          SPREADSHEET_ID_PLATOV: ${{ secrets.SPREADSHEET_ID_PLATOV }}
        run: python collect.py platov

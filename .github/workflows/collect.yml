name: Collect GSC Metrics

on:
  schedule:
    # Пн, Ср, Пт в 08:00 UTC
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:  # ручной запуск из интерфейса GitHub

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore GSC tokens
        run: |
          mkdir -p tokens
          echo '${{ secrets.GSC_TOKENS_JSON }}' | python3 - <<'EOF'
          import sys, json, os, base64
          tokens = json.loads(open('/dev/stdin').read() if False else sys.stdin.read())
          # tokens — dict {email: base64(pickle_bytes)}
          # Смотри раздел «Подготовка секретов» в README
          for email, b64 in tokens.items():
              path = f"tokens/{email}.pickle"
              with open(path, 'wb') as f:
                  f.write(base64.b64decode(b64))
              print(f"  Восстановлен токен: {path}")
          EOF

      - name: Restore Sheets service account
        run: echo '${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}' > sheets_service_account.json

      - name: Run collector
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python collect.py
